# Local development with one command: docker compose up
# Services:
#   web  - Next.js app on http://localhost:3000 (dev mode, hot reload)
#   ws   - Socket.IO chat server on port 3001 (browser connects via
#          NEXT_PUBLIC_WS_URL, default ws://localhost:3001)
# Database:
#   SQLite file at /app/sqlite.db, shared with both services and your host
#   checkout through the repo bind mount. Host tools (bun run db:seed,
#   db:studio, db:migrate) keep working against the same file.
# Notes:
#   Stop the host dev server and `bun run ws` first; they occupy ports 3000/3001.
#   After reseeding the DB from the host, restart the ws service:
#   docker compose restart ws

services:
  # One-shot install so web and ws share a single node_modules volume.
  deps:
    image: oven/bun:1.3.14
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install --frozen-lockfile"

  web:
    image: oven/bun:1.3.14
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      # Override from .env: compose passes quoted values verbatim.
      DATABASE_URL: "file:./sqlite.db"
      BETTER_AUTH_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      deps:
        condition: service_completed_successfully
    command: sh -c "bun run db:migrate && bun run dev"

  ws:
    image: oven/bun:1.3.14
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "file:./sqlite.db"
      BETTER_AUTH_URL: "http://localhost:3000"
      WS_PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    command: sh -c "bun run ws"

volumes:
  node_modules:
  next_cache:
